# Fotos de productos del catálogo online (FOTOS_ALMACEN=local).
# Pegar dentro del <VirtualHost *:443> de www.ventas-xpress.com.ar y recargar Apache:
#   sudo a2enmod headers && sudo apachectl configtest && sudo systemctl reload apache2
# La carpeta tiene que coincidir con FOTOS_DIR del .env.

Alias /fotos /var/www/fotos-kontia
<Directory /var/www/fotos-kontia>
    Options -Indexes -ExecCGI
    AllowOverride None
    # Solo se sirven archivos .webp: cualquier otra cosa (un .php, por ejemplo) da 403.
    Require all denied
    <FilesMatch "\.webp$">
        Require all granted
        # Los archivos nunca cambian (si cambia la foto, cambia el nombre): caché de un año.
        Header set Cache-Control "public, max-age=31536000, immutable"
        Header set Access-Control-Allow-Origin "*"
        Header set X-Content-Type-Options "nosniff"
    </FilesMatch>
</Directory>
