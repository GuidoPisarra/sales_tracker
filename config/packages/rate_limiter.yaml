framework:
    rate_limiter:
        # Altas de cuenta por IP.
        registro:
            policy: sliding_window
            limit: 5
            interval: '1 hour'
        # Pedidos de mail (verificación, olvidé mi clave) por IP.
        mails_cuenta:
            policy: sliding_window
            limit: 5
            interval: '15 minutes'
        # Ingresos con Google por IP.
        google:
            policy: sliding_window
            limit: 20
            interval: '1 minute'
        # Celular que se conecta a Caja con el QR, por IP.
        escaneo_vincular:
            policy: sliding_window
            limit: 10
            interval: '15 minutes'
        # Códigos que manda el celular a Caja, por IP.
        escaneo_codigo:
            policy: sliding_window
            limit: 300
            interval: '1 minute'
        # Catálogo online público, por IP.
        catalogo_publico:
            policy: sliding_window
            limit: 120
            interval: '1 minute'

when@test:
    framework:
        rate_limiter:
            registro: { policy: sliding_window, limit: 10000, interval: '1 hour' }
            mails_cuenta: { policy: sliding_window, limit: 10000, interval: '15 minutes' }
            google: { policy: sliding_window, limit: 10000, interval: '1 minute' }
            escaneo_vincular: { policy: sliding_window, limit: 10000, interval: '15 minutes' }
            escaneo_codigo: { policy: sliding_window, limit: 10000, interval: '1 minute' }
            catalogo_publico: { policy: sliding_window, limit: 10000, interval: '1 minute' }
