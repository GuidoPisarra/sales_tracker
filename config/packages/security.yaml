security:
    enable_authenticator_manager: true
    password_hashers:
        App\Model\Usuario:
            id: 'App\Security\CustomPasswordHasher'
    providers:
        usuarios:
            id: App\Security\UsuariosProvider
    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        login:
            pattern: ^/api/usuario/login
            stateless: true
            provider: usuarios
            user_checker: App\Security\UserChecker
            json_login:
                check_path: /api/usuario/login
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure
            # Máximo 5 intentos fallidos por minuto por usuario e IP.
            login_throttling:
                max_attempts: 5
                interval: '1 minute'
        api:
            pattern: ^/api
            provider: usuarios
            stateless: true
            user_checker: App\Security\UserChecker
            jwt: ~
    # Solo se usa la primera regla que coincide.
    access_control:
        - { path: ^/api/usuario/login, roles: PUBLIC_ACCESS }
        - { path: ^/api/registro, roles: PUBLIC_ACCESS }
        - { path: ^/api/usuario/(google|olvide-clave|restablecer-clave), roles: PUBLIC_ACCESS }
        - { path: ^/api/planes$, roles: PUBLIC_ACCESS }
        - { path: ^/api/webhooks, roles: PUBLIC_ACCESS }
        # El celular que escanea para Caja no tiene sesión: usa la clave que recibe al vincularse.
        - { path: ^/api/escaneo/movil/, roles: PUBLIC_ACCESS }
        - { path: ^/api/publico/, roles: PUBLIC_ACCESS }
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }
